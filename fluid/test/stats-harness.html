<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluid stats harness</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0c1015; color: #d6dde6; font: 13px/1.35 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 12px; background: #151b23; border-bottom: 1px solid #263140; }
  header h1 { font-size: 14px; margin: 0 8px 0 0; font-weight: 600; }
  button { background: #1f2a37; color: #d6dde6; border: 1px solid #33425a; border-radius: 4px; padding: 3px 8px; font: inherit; cursor: pointer; }
  button:hover { background: #28384c; }
  #status { color: #8fb4d8; margin-left: auto; font-variant-numeric: tabular-nums; }
  #results { padding: 8px 12px; font: 12px/1.35 ui-monospace, Consolas, monospace; }
  .row { padding: 1px 0; border-bottom: 1px solid #1b232d; word-break: break-word; }
  .row.pass b { color: #5fd38a; }
  .row.fail b { color: #ff6b6b; }
  .row.info b { color: #8fb4d8; }
  .row i { color: #7f8c9b; font-style: normal; }
  #summary { font-weight: 600; margin-bottom: 6px; }
</style>
</head>
<body>
<header>
  <h1>Fluid stats harness</h1>
  <button id="run">run all</button>
  <button id="runSynthetic">synthetic only</button>
  <div id="status">loading...</div>
</header>
<div id="results"><div id="summary"></div><div id="list"></div></div>
<script type="module" src="./stats-harness.js"></script>
</body>
</html>
